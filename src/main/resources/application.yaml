# yaml-language-server: $schema=none
spring:
  application:
    name: demo
  datasource:
    url: ${DB_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:postgres}}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:}
    driver-class-name: ${DB_DRIVER:org.postgresql.Driver}

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

  jackson:
    default-property-inclusion: non_null

aws:
  region: ${AWS_REGION:us-east-1}
  iam:
    role-arn: ${AWS_ROLE_ARN:arn:aws:iam::${AWS_ACCOUNT_ID:000000000000}:role/${AWS_ROLE_NAME:SafeRole-ku-hys-03}}
  s3:
    bucket: ${AWS_S3_BUCKET:}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
