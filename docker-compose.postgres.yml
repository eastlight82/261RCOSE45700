name: unflatten

services:
  postgres:
    image: postgres:16
    container_name: vir-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: vir_local
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - vir_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d vir_local"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  vir_postgres_data:
